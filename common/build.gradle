buildscript {
    repositories {
        maven { url "https://repo.spongepowered.org/repository/maven-public/" }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "org.spongepowered:vanillagradle:0.2.2"
    }
}

if (gradle.ext.minecraft_version == "1.21.11") {
    apply plugin: "java"
    apply plugin: "org.spongepowered.gradle.vanilla"

    minecraft {
        version gradle.ext.minecraft_version
    }

    def mcConfig = configurations.findByName("minecraft")
    if (mcConfig != null) {
        configurations.compileOnly.extendsFrom(mcConfig)
    }
} else {
    apply plugin: "unimined-common"
}

repositories {

}

dependencies {
    compileOnly "org.spongepowered:mixin:0.8.7"
    testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.12.2"
}

tasks.withType(Test).configureEach {
    enabled = true
    useJUnitPlatform()
}

tasks.named("compileTestJava").configure {
    enabled = true
}

// Preview count regression tests use the mapped BlockPos type from main.
tasks.named('compileTestJava', JavaCompile).configure {
    classpath += sourceSets.main.compileClasspath
}
tasks.named('test', Test).configure {
    classpath += sourceSets.main.runtimeClasspath
}
