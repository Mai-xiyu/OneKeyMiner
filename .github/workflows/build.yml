name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read project properties
        id: props
        run: |
          MC_VERSION="$(grep '^mc_ver=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          PROPS_FILE="versionProperties/${MC_VERSION}.properties"
          JAVA_VERSION="21"
          if [ -f "$PROPS_FILE" ]; then
            JV="$(grep '^java_version=' "$PROPS_FILE" | cut -d= -f2 | tr -d '\r')"
            if [ -n "$JV" ]; then JAVA_VERSION="$JV"; fi
            BF="$(grep '^builds_for=' "$PROPS_FILE" | cut -d= -f2 | tr -d '\r')"
            if [ -n "$BF" ]; then BUILDS_FOR="$BF"; fi
          fi
          echo "JAVA_VERSION=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILDS_FOR=${BUILDS_FOR:-fabric,forge,neoforge}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.props.outputs.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: '${{ steps.props.outputs.JAVA_VERSION }}'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: |
          if [ "${{ steps.props.outputs.BUILDS_FOR }}" = "fabric" ]; then
            ./gradlew :fabric:build --no-daemon --max-workers=1 -x test -x compileTestJava
          else
            ./gradlew build --no-daemon --max-workers=1 -x test -x compileTestJava
          fi

      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v6
        with:
          name: onekeyminer-fabric
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev.jar
          if-no-files-found: warn

      - name: Upload Forge artifact
        uses: actions/upload-artifact@v6
        with:
          name: onekeyminer-forge
          path: |
            forge/build/libs/*.jar
            !forge/build/libs/*-sources.jar
            !forge/build/libs/*-dev.jar
          if-no-files-found: warn

      - name: Upload NeoForge artifact
        uses: actions/upload-artifact@v6
        with:
          name: onekeyminer-neoforge
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-dev.jar
          if-no-files-found: warn
