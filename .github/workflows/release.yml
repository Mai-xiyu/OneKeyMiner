name: Release

on:
  push:
    tags:
      - '*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. 1.21.7-1.6.6)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Read project properties
        id: props
        run: |
          TAG_NAME="${{ steps.tag.outputs.name }}"
          MC_VERSION="$(grep '^mc_ver=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          case "$TAG_NAME" in
            "$MC_VERSION"-*) MOD_VERSION="${TAG_NAME#"$MC_VERSION"-}" ;;
            *)
              echo "::error::Release tag '$TAG_NAME' must start with '$MC_VERSION-'"
              exit 1
              ;;
          esac
          if [ -z "$MOD_VERSION" ]; then
            echo "::error::Release tag '$TAG_NAME' does not contain a mod version"
            exit 1
          fi

          PROPS_FILE="versionProperties/${MC_VERSION}.properties"
          JAVA_VERSION="21"
          BUILDS_FOR="fabric,forge,neoforge"
          if [ -f "$PROPS_FILE" ]; then
            JV="$(grep '^java_version=' "$PROPS_FILE" | cut -d= -f2 | tr -d '\r')"
            if [ -n "$JV" ]; then JAVA_VERSION="$JV"; fi
            BF="$(grep '^builds_for=' "$PROPS_FILE" | cut -d= -f2 | tr -d '\r')"
            if [ -n "$BF" ]; then BUILDS_FOR="$BF"; fi
          fi

          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "MC_VERSION=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "MOD_VERSION=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "JAVA_VERSION=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILDS_FOR=$BUILDS_FOR" >> "$GITHUB_OUTPUT"
          echo "HAS_NEOFORGE=$( [[ "$BUILDS_FOR" == *neoforge* ]] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.props.outputs.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: '${{ steps.props.outputs.JAVA_VERSION }}'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        env:
          RELEASE_MOD_VERSION: ${{ steps.props.outputs.MOD_VERSION }}
        run: |
          if [ "${{ steps.props.outputs.BUILDS_FOR }}" = "fabric" ]; then
            ./gradlew :common:test :common:javadoc :fabric:build "-Pmod_version=${RELEASE_MOD_VERSION}" --no-daemon --max-workers=1
          else
            ./gradlew :common:test :common:javadoc build "-Pmod_version=${RELEASE_MOD_VERSION}" --no-daemon --max-workers=1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.props.outputs.TAG_NAME }}
          name: OneKeyMiner ${{ steps.props.outputs.TAG_NAME }}
          body: |
            ## OneKeyMiner ${{ steps.props.outputs.TAG_NAME }}

            - Minecraft: ${{ steps.props.outputs.MC_VERSION }}
            - Mod Version: ${{ steps.props.outputs.MOD_VERSION }}

            ### Downloads

            | Platform | File |
            |----------|------|
            | Fabric | `onekeyminer-fabric-*.jar` |
            | Forge | `onekeyminer-forge-*.jar` |
            ${{ steps.props.outputs.HAS_NEOFORGE == 'true' && '| NeoForge | `onekeyminer-neoforge-*.jar` |' || '' }}

            ### Requirements

            - Minecraft ${{ steps.props.outputs.MC_VERSION }}
            - Java ${{ steps.props.outputs.JAVA_VERSION }}+

            ### Changelog

            See [commits](https://github.com/${{ github.repository }}/commits/${{ steps.props.outputs.TAG_NAME }}) for details.
          files: |
            fabric/build/libs/!(*-sources|*-dev).jar
            forge/build/libs/!(*-sources|*-dev).jar
            neoforge/build/libs/!(*-sources|*-dev).jar
          draft: false
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
