name: Release

on:
  push:
    tags:
      - '*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (for example, 1.21.9-1.6.9)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Read project properties
        id: props
        run: |
          TAG_NAME="${{ steps.tag.outputs.name }}"
          MC_VERSION="$(grep '^mc_ver=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          case "$TAG_NAME" in
            "$MC_VERSION"-*) MOD_VERSION="${TAG_NAME#"$MC_VERSION"-}" ;;
            *)
              echo "::error::Release tag '$TAG_NAME' must start with '$MC_VERSION-'"
              exit 1
              ;;
          esac
          if [ -z "$MOD_VERSION" ]; then
            echo "::error::Release tag '$TAG_NAME' does not contain a mod version"
            exit 1
          fi

          PROPS_FILE="versionProperties/${MC_VERSION}.properties"
          JAVA_VERSION="21"
          BUILDS_FOR="fabric,forge,neoforge"
          if [ -f "$PROPS_FILE" ]; then
            JV="$(grep '^java_version=' "$PROPS_FILE" | cut -d= -f2 | tr -d '\r')"
            if [ -n "$JV" ]; then JAVA_VERSION="$JV"; fi
            BF="$(grep '^builds_for=' "$PROPS_FILE" | cut -d= -f2 | tr -d '\r')"
            if [ -n "$BF" ]; then BUILDS_FOR="$BF"; fi
          fi

          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "MC_VERSION=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "MOD_VERSION=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "JAVA_VERSION=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILDS_FOR=$BUILDS_FOR" >> "$GITHUB_OUTPUT"
          echo "HAS_NEOFORGE=$( [[ "$BUILDS_FOR" == *neoforge* ]] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.props.outputs.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: '${{ steps.props.outputs.JAVA_VERSION }}'
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        env:
          RELEASE_MOD_VERSION: ${{ steps.props.outputs.MOD_VERSION }}
        run: |
          if [ "${{ steps.props.outputs.BUILDS_FOR }}" = "fabric" ]; then
            ./gradlew :fabric:build "-Pmod_version=${RELEASE_MOD_VERSION}" --no-daemon --max-workers=1 --no-parallel
          else
            ./gradlew build "-Pmod_version=${RELEASE_MOD_VERSION}" --no-daemon --max-workers=1 --no-parallel
          fi

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.props.outputs.TAG_NAME }}
          name: OneKeyMiner ${{ steps.props.outputs.TAG_NAME }}
          body: |
            ## OneKeyMiner ${{ steps.props.outputs.TAG_NAME }}

            - Minecraft: ${{ steps.props.outputs.MC_VERSION }}
            - Mod version: ${{ steps.props.outputs.MOD_VERSION }}

            ### Downloads

            | Loader | File |
            |--------|------|
            | Fabric | `onekeyminer-fabric-*.jar` |
            | Forge | `onekeyminer-forge-*.jar` |
            ${{ steps.props.outputs.HAS_NEOFORGE == 'true' && '| NeoForge | `onekeyminer-neoforge-*.jar` |' || '' }}

            Use the JAR matching your loader. Modrinth and CurseForge receive separate loader-specific files.

            ### Requirements

            - Minecraft ${{ steps.props.outputs.MC_VERSION }}
            - Java ${{ steps.props.outputs.JAVA_VERSION }}+

            ### Changelog

            See [commits](https://github.com/${{ github.repository }}/commits/${{ steps.props.outputs.TAG_NAME }}) for details.
          files: |
            fabric/build/libs/!(*-sources|*-dev).jar
            forge/build/libs/!(*-sources|*-dev).jar
            neoforge/build/libs/!(*-sources|*-dev).jar
          draft: false
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Fabric to Modrinth and CurseForge
        id: publish_fabric
        if: contains(steps.props.outputs.BUILDS_FOR, 'fabric')
        continue-on-error: true
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: LZu4H9cp
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-unfeature-mode: none
          curseforge-id: 1078620
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
          name: OneKeyMiner ${{ steps.props.outputs.TAG_NAME }} (Fabric)
          version: ${{ steps.props.outputs.TAG_NAME }}-fabric
          version-type: release
          changelog: |
            See the GitHub release for changes:
            https://github.com/${{ github.repository }}/releases/tag/${{ steps.props.outputs.TAG_NAME }}
          loaders: fabric
          game-versions: ${{ steps.props.outputs.MC_VERSION }}
          game-version-filter: none
          environment: client | server
          retry-attempts: 3

      - name: Publish Forge to Modrinth and CurseForge
        id: publish_forge
        if: contains(steps.props.outputs.BUILDS_FOR, 'forge')
        continue-on-error: true
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: LZu4H9cp
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-unfeature-mode: none
          curseforge-id: 1078620
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: forge/build/libs/!(*-@(dev|sources|javadoc)).jar
          name: OneKeyMiner ${{ steps.props.outputs.TAG_NAME }} (Forge)
          version: ${{ steps.props.outputs.TAG_NAME }}-forge
          version-type: release
          changelog: |
            See the GitHub release for changes:
            https://github.com/${{ github.repository }}/releases/tag/${{ steps.props.outputs.TAG_NAME }}
          loaders: forge
          game-versions: ${{ steps.props.outputs.MC_VERSION }}
          game-version-filter: none
          environment: client | server
          retry-attempts: 3

      - name: Publish NeoForge to Modrinth and CurseForge
        id: publish_neoforge
        if: contains(steps.props.outputs.BUILDS_FOR, 'neoforge')
        continue-on-error: true
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: LZu4H9cp
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-unfeature-mode: none
          curseforge-id: 1078620
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar
          name: OneKeyMiner ${{ steps.props.outputs.TAG_NAME }} (NeoForge)
          version: ${{ steps.props.outputs.TAG_NAME }}-neoforge
          version-type: release
          changelog: |
            See the GitHub release for changes:
            https://github.com/${{ github.repository }}/releases/tag/${{ steps.props.outputs.TAG_NAME }}
          loaders: neoforge
          game-versions: ${{ steps.props.outputs.MC_VERSION }}
          game-version-filter: none
          environment: client | server
          retry-attempts: 3

      - name: Verify external publishing
        if: always() && steps.release.outcome == 'success'
        env:
          BUILDS_FOR: ${{ steps.props.outputs.BUILDS_FOR }}
          FABRIC_OUTCOME: ${{ steps.publish_fabric.outcome }}
          FORGE_OUTCOME: ${{ steps.publish_forge.outcome }}
          NEOFORGE_OUTCOME: ${{ steps.publish_neoforge.outcome }}
        run: |
          failed=0
          check_publish() {
            loader="$1"
            outcome="$2"
            if [[ ",$BUILDS_FOR," == *",$loader,"* ]] && [ "$outcome" != "success" ]; then
              echo "::error::External publishing failed for $loader (outcome: ${outcome:-missing})"
              failed=1
            fi
          }
          check_publish fabric "$FABRIC_OUTCOME"
          check_publish forge "$FORGE_OUTCOME"
          check_publish neoforge "$NEOFORGE_OUTCOME"
          exit "$failed"
