plugins {
    id 'root'
    id 'xyz.wagyourtail.unimined' version '1.4.2-SNAPSHOT' apply false
    id 'xyz.wagyourtail.jvmdowngrader' version '1.3.6'
}

// Fabric publishes intermediary 0.0.0 for unobfuscated Minecraft releases.
// Resolve that artifact by path without weakening metadata checks globally.
if (!gradle.ext.minecraft_version.startsWith("1.")) {
    allprojects {
        repositories {
            exclusiveContent {
                forRepository {
                    ivy {
                        url = "https://maven.fabricmc.net/"
                        patternLayout {
                            artifact "[organisation]/[module]/0.0.0/[module]-0.0.0(-[classifier]).[ext]"
                            m2compatible = true
                        }
                        metadataSources {
                            artifact()
                        }
                    }
                }
                filter {
                    includeModule("net.fabricmc", "intermediary")
                }
            }
        }
    }
}