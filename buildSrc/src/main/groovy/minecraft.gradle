plugins {
    id 'common'
    id 'xyz.wagyourtail.unimined'
}

unimined.minecraft(sourceSets.main, true) {
    version gradle.ext.minecraft_version

    mappings {
        mojmap()
    }
}

if (project.name == "common") return // Don't apply the code below to the common project

unimined.minecraft(sourceSets.main, true) {
    mods.modImplementation {
        mixinRemap {
            reset()
            enableBaseMixin()
            enableMixinExtra()
        }
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:0.8.7"

    // Common sources are compiled directly into each loader source set below.
    // Keep the project dependency off the runtime module path; otherwise Forge
    // sees both the loader module and onekeyminer.common exporting identical
    // packages and refuses to create the module layer.
    compileOnly(project(":common"))
}

processResources {
    from project(":common").sourceSets.main.resources
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}
