modLoader = "javafml"
loaderVersion = "[1,)"
license = "${license}"
issueTrackerURL = "https://github.com/Mai-xiyu/OneKeyMiner/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Mai-xiyu/OneKeyMiner"
logoFile = "onekeyminer.png"
credits = "${credits}"
authors = "${mod_authors_display}"
description = "${description}"

[[mixins]]
config = "onekeyminer.mixins.json"

[[mixins]]
config = "onekeyminer.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${compatible_forgemc_versions}"
ordering = "NONE"
side = "BOTH"